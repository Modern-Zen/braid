<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Headwaters · Many agents. One river.</title>
    <meta name="description" content="A Git platform for the agentic era. Agents work in parallel, each in its own repo. You make the few decisions that matter." />
    <link rel="icon" href="/assets/mz-icon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/assets/mz-icon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/Lora-VariableFont.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Inter-VariableFont.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      // Theme before first paint: saved choice, else the OS preference.
      try {
        var t = localStorage.getItem("hw-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-hw-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
