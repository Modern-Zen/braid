packages:
  - apps/*
  - packages/*
  # The demo River is its own repo root (seeded into Artifacts), with its own lockfile.
  - "!apps/demo-riverlevels"

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  core-js-pure: false

# pnpm 10 (e.g. the Workers Builds image) reads this list; pnpm 11 reads allowBuilds above.
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
